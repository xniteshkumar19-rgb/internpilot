<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternPilot - Application Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <div class="brand">
          <div class="brand-badge">Pilot</div>
          <h1>Application Tracker</h1>
        </div>
        <p class="tagline">Review and track your curated internship applications stored locally in your browser.</p>
      </div>
      <div class="header-nav">
        <a href="index.html" class="nav-link-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Pilot
        </a>
      </div>
    </header>

    <main class="card tracker-card">
      <div class="tracker-header">
        <div>
          <h2>Saved Applications</h2>
          <span class="card-subtitle" id="tracker-count">0 applications saved</span>
        </div>
        <button id="clear-all-btn" class="btn-secondary danger-action" style="display:none;">Clear All</button>
      </div>

      <div id="tracker-list" class="tracker-list">
        <!-- Rendered by tools.js / script -->
      </div>
    </main>

    <footer class="app-footer">
      <p class="disclaimer-text">
        <strong>Disclaimer:</strong> Scam check shows warning signs, not proof. Verify the company independently.
      </p>
    </footer>
  </div>

  <script src="tools.js"></script>
  <script>
    function renderTracker() {
      const container = document.getElementById('tracker-list');
      const countLabel = document.getElementById('tracker-count');
      const clearBtn = document.getElementById('clear-all-btn');
      const apps = loadApplications();

      countLabel.textContent = `${apps.length} application${apps.length === 1 ? '' : 's'} saved`;

      if (apps.length === 0) {
        clearBtn.style.display = 'none';
        container.innerHTML = `
          <div class="tracker-empty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <p>No applications saved yet.</p>
            <a href="index.html" class="btn-primary" style="margin-top: 1rem; display: inline-flex;">Go to InternPilot</a>
          </div>
        `;
        return;
      }

      clearBtn.style.display = 'inline-flex';
      container.innerHTML = apps.map(app => {
        const riskClass = app.riskLevel === 'high' ? 'badge-danger' : (app.riskLevel === 'medium' ? 'badge-warning' : 'badge-success');
        const matchDisplay = app.matchPercent !== null ? `about ${app.matchPercent}% match` : 'Match not estimated';
        const formattedDate = new Date(app.createdAt).toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        return `
          <div class="tracker-item" data-id="${app.id}">
            <div class="tracker-item-main">
              <div class="tracker-item-title-row">
                <h3>${escapeHtml(app.role)}</h3>
                <span class="badge ${riskClass}">${escapeHtml(app.riskLevel.toUpperCase())} RISK</span>
              </div>
              <div class="tracker-company">${escapeHtml(app.company)}</div>
              <div class="tracker-meta">
                <span><strong>Deadline:</strong> ${escapeHtml(app.deadline)}</span>
                <span>•</span>
                <span><strong>Alignment:</strong> ${matchDisplay}</span>
                <span>•</span>
                <span><strong>Saved:</strong> ${formattedDate}</span>
              </div>
            </div>
            <div class="tracker-item-actions">
              <button class="btn-delete" onclick="deleteApp('${app.id}')" title="Remove application">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function deleteApp(id) {
      const apps = loadApplications().filter(a => a.id !== id);
      localStorage.setItem('internpilot_apps', JSON.stringify(apps));
      renderTracker();
    }

    document.getElementById('clear-all-btn').addEventListener('click', () => {
      if (confirm('Are you sure you want to clear all saved applications?')) {
        localStorage.removeItem('internpilot_apps');
        renderTracker();
      }
    });

    renderTracker();
  </script>
</body>
</html>
